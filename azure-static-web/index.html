<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Elise Institusjon - Sikker pålogging</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0078D4;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <h1>Omdirigerer til innlogging...</h1>
  <p>Du vil bli bedt om å logge inn med Microsoft-legitimasjoner.</p>

  <script src="config.js"></script>
  <script>
    (function() {
      // Samme som React Native app: clear sessionStorage på load
      if (window.sessionStorage) {
        window.sessionStorage.clear();
      }
      // Umiddelbar redirect til Power Apps med prompt=login - tilsvarer window.location.replace(getAuthUrl())
      window.location.replace(getAuthUrl());
    })();
  </script>
</body>
</html>
